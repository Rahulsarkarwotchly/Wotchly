<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15002e"/>
      <stop offset="50%" stop-color="#060c20"/>
      <stop offset="100%" stop-color="#010810"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="28%" stop-color="#FF4D94"/>
      <stop offset="62%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#9D4EDD" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0"/>
    </radialGradient>
    <filter id="logoGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#FFD700" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Inner ambient glow -->
  <rect width="512" height="512" rx="110" fill="url(#centerGlow)"/>

  <!-- Premium border glow (two-layer) -->
  <rect x="2" y="2" width="508" height="508" rx="109" fill="none"
        stroke="url(#borderGrad)" stroke-width="3" opacity="0.6"/>
  <rect x="5" y="5" width="502" height="502" rx="107" fill="none"
        stroke="url(#borderGrad)" stroke-width="1" opacity="0.25"/>

  <!-- Corner accent dots (cinematic/OTT feel) -->
  <circle cx="58" cy="58" r="7" fill="#FFD700" opacity="0.55"/>
  <circle cx="454" cy="58" r="7" fill="#00B4D8" opacity="0.55"/>
  <circle cx="58" cy="454" r="7" fill="#FF4D94" opacity="0.55"/>
  <circle cx="454" cy="454" r="7" fill="#9D4EDD" opacity="0.55"/>

  <!-- W lettermark — geometric polygon -->
  <polygon
    points="62,138 126,138 198,348 256,238 314,348 386,138 450,138 368,384 336,384 256,264 176,384 144,384"
    fill="url(#logoGrad)"
    filter="url(#logoGlow)"
  />

  <!-- Subtle top shine overlay -->
  <rect x="0" y="0" width="512" height="180" rx="110" fill="white" opacity="0.04"/>
</svg>
