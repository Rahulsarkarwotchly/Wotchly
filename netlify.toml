[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# Allow both functions to run up to 26 seconds (Netlify free-tier max).
# This is enough time for the Render free-tier server to cold-start.
[functions."get-feed"]
  timeout = 26

[functions."get-stream"]
  timeout = 26

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
