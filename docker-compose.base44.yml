services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:5000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "corepack enable pnpm && pnpm install && pnpm dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
