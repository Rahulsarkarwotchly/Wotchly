services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm run dev"
    restart: unless-stopped

volumes:
  node_modules:
